services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: cuidared
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cuidared_dev}
      POSTGRES_DB: cuidared
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cuidared"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://cuidared:${POSTGRES_PASSWORD:-cuidared_dev}@db:5432/cuidared
      SECRET_KEY: ${SECRET_KEY:-solo-para-desarrollo}
      AGEBS_PRIORITARIAS: ${AGEBS_PRIORITARIAS:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
